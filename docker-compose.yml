services:
  travel-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
      - AMAP_API_KEY=${AMAP_API_KEY}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
    volumes:
      - .env:/app/.env:ro
      - memory:/app/memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  streamlit:
    build: .
    command: streamlit run web/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
      - AMAP_API_KEY=${AMAP_API_KEY}
    volumes:
      - .env:/app/.env:ro
      - memory:/app/memory
    restart: unless-stopped

volumes:
  memory:
