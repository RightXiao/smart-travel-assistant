<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能旅行助手 · AI 攻略定制</title>
  <meta name="description" content="填写旅行需求，AI 为你定制可执行的逐日旅行攻略：景点排程、预算拆分、美食住宿建议。" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>

      <symbol id="i-food" viewBox="0 0 24 24"><line x1="6" y1="2" x2="6" y2="10"/><path d="M4 2v5a2 2 0 0 0 4 0V2"/><path d="M6 13v9"/><path d="M17 2c-2 2-3 4.5-3 7.5 0 2.7 1.3 3.9 3 4.5v8"/><line x1="17" y1="2" x2="17" y2="22"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H12"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>

      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></symbol>
      <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
      <symbol id="i-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>

      <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>

      <symbol id="i-trending" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M13 7l-2 5 3 3v6"/><path d="M11 12l-3 2v6"/><path d="M14 9l4 1"/></symbol>
    </defs>
  </svg>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="返回首页">
        <span class="brand-mark"><svg class="icon"><use href="#i-compass"/></svg></span>
        <span class="brand-text">
          <strong>智能旅行助手</strong>
          <small>AI 攻略定制</small>
        </span>
      </a>
      <nav class="header-nav" aria-label="页面导航">
        <a href="#/" data-nav="home" class="nav-link">定制攻略</a>
        <a href="#/inspiration" data-nav="inspiration" class="nav-link">灵感速览</a>
      </nav>
      <div class="header-actions">
        <span id="model-badge" class="model-badge" title="当前 LLM 接入（点击查看详情）">
          <svg class="icon"><use href="#i-sparkle"/></svg>
          <span id="model-badge-text">模型加载中…</span>
        </span>
        <span id="mock-badge" class="mock-badge" hidden>演示数据</span>
        <button id="settings-btn" class="btn btn-ghost btn-icon" type="button" title="连接设置" aria-haspopup="dialog">
          <svg class="icon"><use href="#i-settings"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view container" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="container">
      <p>智能旅行助手 · 行程由 <span id="footer-model">大模型</span> + 高德地图 API 生成，门票价格与营业时间请以官方信息为准。</p>
    </div>
  </footer>

  <!-- AI 助手浮动入口 + 侧滑对话抽屉 -->
  <button id="chat-fab" class="chat-fab" type="button" aria-label="问 AI 助手">
    <svg class="icon"><use href="#i-message"/></svg>
    <span class="chat-fab-label">问助手</span>
  </button>

  <aside id="chat-drawer" class="chat-drawer" hidden aria-label="AI 助手对话" role="dialog">
    <div class="chat-head">
      <div class="chat-head-title">
        <svg class="icon"><use href="#i-sparkle"/></svg>
        <div>
          <strong>问问 AI 助手</strong>
          <small>随时追问行程细节、改需求、聊目的地</small>
        </div>
      </div>
      <button id="chat-close" class="btn btn-ghost btn-icon" type="button" aria-label="关闭对话">
        <svg class="icon"><use href="#i-x"/></svg>
      </button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div id="chat-suggestions" class="chat-suggestions"></div>
    <form id="chat-form" class="chat-input-row" autocomplete="off">
      <input id="chat-input" class="input" type="text" maxlength="2000"
             placeholder="输入你的问题，回车发送…" aria-label="对话输入" />
      <button id="chat-send" class="btn btn-primary btn-icon-lg" type="submit" aria-label="发送">
        <svg class="icon"><use href="#i-send"/></svg>
      </button>
    </form>
  </aside>

  <!-- 连接设置弹层：API 地址 / 鉴权 Token（API_AUTH_TOKEN 启用时填写） -->
  <div id="settings-overlay" class="overlay" hidden>
    <div class="settings-pop" role="dialog" aria-label="连接设置">
      <div class="settings-pop-head">
        <strong>连接设置</strong>
        <button id="settings-close" class="btn btn-ghost btn-icon" type="button" aria-label="关闭设置">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>
      <label class="field">
        <span class="field-label">API 地址</span>
        <input id="settings-base" class="input" type="text" placeholder="默认同源，例如 http://127.0.0.1:8000" />
        <span class="field-hint">页面与 API 不在同一服务时填写，留空使用当前站点。</span>
      </label>
      <label class="field">
        <span class="field-label">Bearer Token（可选）</span>
        <input id="settings-token" class="input" type="password" placeholder="服务端开启 API_AUTH_TOKEN 时填写" />
        <span class="field-hint">对应服务端环境变量 <code>API_AUTH_TOKEN</code>，未开启则无需填写。</span>
      </label>
      <div class="field llm-panel">
        <span class="field-label">模型接入（多厂商）</span>
        <div id="llm-config" class="llm-config">
          <div class="llm-current">
            <div class="llm-row"><span class="llm-key">当前厂商</span><span id="llm-provider" class="llm-value">—</span></div>
            <div class="llm-row"><span class="llm-key">模型</span><span id="llm-model" class="llm-value">—</span></div>
            <div class="llm-row"><span class="llm-key">端点</span><span id="llm-base-url" class="llm-value llm-url">—</span></div>
            <div class="llm-row"><span class="llm-key">API Key</span><span id="llm-key" class="llm-value">—</span></div>
          </div>
          <div class="llm-presets">
            <span class="llm-key">支持的厂商</span>
            <div id="llm-preset-list" class="llm-preset-list"></div>
          </div>
          <p class="field-hint">
            切换厂商：在服务端 <code>.env</code> 中设置 <code>LLM_PROVIDER</code>（如
            <code>deepseek</code> / <code>qwen</code> / <code>openai</code> / <code>ollama</code>）与对应的
            <code>LLM_API_KEY</code>、<code>LLM_MODEL</code>，重启服务即生效（详见 README「多厂商模型接入」）。
          </p>
        </div>
      </div>
      <div class="settings-pop-actions">
        <button id="settings-save" class="btn btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="assertive"></div>

  <script src="js/api.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
